events {
    worker_connections 1024;
}

http {
    client_max_body_size 25M;

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name atende-bem.online www.atende-bem.online api.atende-bem.online;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # Painel Next.js — atende-bem.online
    server {
        listen 443 ssl;
        server_name atende-bem.online www.atende-bem.online;

        ssl_certificate     /etc/letsencrypt/live/atende-bem.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/atende-bem.online/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass         http://painel:3001;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Backend API — api.atende-bem.online
    server {
        listen 443 ssl;
        server_name api.atende-bem.online;

        ssl_certificate     /etc/letsencrypt/live/atende-bem.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/atende-bem.online/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass         http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
